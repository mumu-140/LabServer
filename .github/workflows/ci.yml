name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-packages --dev --locked
      - run: uv run ruff check .
      - run: uv run mypy services/core/src packages/contracts/src apps/web/src
      - run: uv run pytest -q
