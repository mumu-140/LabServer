{# 新建预约表单。分区 + GPU 卡号多选下拉。
   gpu_ids 后端契约不变：仍提交逗号串（如 "0,1"）到 name="gpu_ids"。
   可见多选 <select> 无 name，JS 把选中值写入隐藏 input#gpu_ids_hidden。
   GPU 选项上限取所有服务器 gpu_count 最大值（无则回退 8）。 #}
{% set ns = namespace(maxg=0) %}
{% for item in servers %}{% if item.gpu_count and item.gpu_count > ns.maxg %}{% set ns.maxg = item.gpu_count %}{% endif %}{% endfor %}
{% set gpu_max = ns.maxg if ns.maxg > 0 else 8 %}
<form class="planned-use-form" method="post" action="/schedule">
  <div class="form-section">
    <div class="form-section-title">基本意图</div>
    <div class="form-grid">
      <label>目标服务器
        <select name="server_key" id="pf_server" required>
          {% for item in servers %}
          <option value="{{ item.key }}" data-gpu="{{ item.gpu_count or 0 }}" {% if item.key == form.server_key %}selected{% endif %}>{{ item.key }} ({{ item.display_name }})</option>
          {% endfor %}
        </select>
      </label>
      <label>任务标题
        <input name="title" required maxlength="200" placeholder="例如：大语言模型微调 / RNA-seq 比对" value="{{ form.title or "" }}" />
      </label>
      <label>所属课题/项目
        <input name="project" maxlength="200" placeholder="可选填，用于团队协作追溯" value="{{ form.project or "" }}" />
      </label>
    </div>
  </div>

  <div class="form-section">
    <div class="form-section-title">时间窗口</div>
    <div class="form-grid">
      <label>预约日期
        <input type="date" name="date" value="{{ form.date or date }}" />
      </label>
      <label>开始时间
        <input type="datetime-local" name="start_at" id="pf_start" required value="{{ form.start_at or "" }}" />
      </label>
      <label>结束时间
        <input type="datetime-local" name="end_at" id="pf_end" required value="{{ form.end_at or "" }}" />
      </label>
    </div>
  </div>

  <div class="form-section">
    <div class="form-section-title">资源规格 <span class="form-section-note">（均为选填）</span></div>
    <div class="form-grid">
      <label>CPU 核心数
        <input type="number" name="cpu_cores" min="1" placeholder="需保留核心数" value="{{ form.cpu_cores or "" }}" />
      </label>
      <label>内存容量 (GB)
        <input type="number" name="memory_gb" min="0" step="0.5" placeholder="预计占用内存" value="{{ form.memory_gb or "" }}" />
      </label>
      <label>GPU 显卡数
        <input type="number" name="gpu_count" min="0" max="{{ gpu_max }}" placeholder="申请卡数总量" value="{{ form.gpu_count or "" }}" />
      </label>
      <label>指定 GPU 卡号
        {# 复选框卡片多选：点一下即选，无需 Ctrl；JS 同步选中值到隐藏 input（后端契约不变，仍是逗号串） #}
        {% set preselected = (form.gpu_ids or "").replace(" ", "").split(",") %}
        <div class="gpu-chips" id="pf_gpu_chips" role="group" aria-describedby="pf_gpu_help">
          {% for i in range(gpu_max) %}
          <label class="gpu-chip">
            <input type="checkbox" class="gpu-chip-cb" value="{{ i }}" {% if i|string in preselected %}checked{% endif %} />
            <span>GPU {{ i }}</span>
          </label>
          {% endfor %}
        </div>
        <input type="hidden" name="gpu_ids" id="pf_gpu_hidden" value="{{ form.gpu_ids or "" }}" />
        <span class="form-help" id="pf_gpu_help">点选一或多张卡；不选表示不指定具体卡号（仅按卡数申请）</span>
      </label>
    </div>
  </div>

  <div class="form-section">
    <label>备注说明
      <input name="note" maxlength="2000" placeholder="选填，关于实验或计算的额外补充" value="{{ form.note or "" }}" />
    </label>
  </div>

  <button type="submit">
    <span>发布算力预约意向</span>
    <span class="sr-only">Publish planned use</span>
  </button>
</form>

<script>
(function () {
  var chips = document.getElementById('pf_gpu_chips');
  var hidden = document.getElementById('pf_gpu_hidden');
  var serverSel = document.getElementById('pf_server');
  var startEl = document.getElementById('pf_start');
  var endEl = document.getElementById('pf_end');
  if (!chips || !hidden) return;
  var boxes = Array.prototype.slice.call(chips.querySelectorAll('.gpu-chip-cb'));

  // 复选框 -> 隐藏逗号串（保持后端契约，升序）
  function syncGpu() {
    var vals = boxes.filter(function (b) { return b.checked && !b.disabled; })
                    .map(function (b) { return parseInt(b.value, 10); })
                    .sort(function (a, b) { return a - b; });
    hidden.value = vals.join(',');
  }
  boxes.forEach(function (b) { b.addEventListener('change', syncGpu); });
  syncGpu();

  // 按所选服务器的 GPU 数量禁用越界卡号
  function limitByServer() {
    if (!serverSel) return;
    var opt = serverSel.options[serverSel.selectedIndex];
    var n = opt ? parseInt(opt.getAttribute('data-gpu') || '0', 10) : 0;
    boxes.forEach(function (b, idx) {
      var over = n > 0 && idx >= n;
      b.disabled = over;
      b.closest('.gpu-chip').classList.toggle('is-disabled', over);
      if (over) b.checked = false;
    });
    syncGpu();
  }
  if (serverSel) serverSel.addEventListener('change', limitByServer);
  limitByServer();

  // datetime-local 默认今日（若为空）：填当天 09:00 / 18:00
  function pad(x){return (x<10?'0':'')+x;}
  function todayAt(h){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(h)+':00';}
  if (startEl && !startEl.value) startEl.value = todayAt(9);
  if (endEl && !endEl.value) endEl.value = todayAt(18);
})();
</script>
