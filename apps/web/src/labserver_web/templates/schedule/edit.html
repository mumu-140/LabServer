{% extends "base.html" %}
{% block title %}Edit planned use — LabServer{% endblock %}
{% block content %}
<h1>Edit planned use</h1>
<p class="lede">Update "{{ plan.title }}". Times are interpreted in {{ timezone_name }}.</p>

{% if form_error %}
<p class="error" role="alert">{{ form_error }}</p>
{% endif %}

<form class="planned-use-form" method="post" action="/schedule/{{ plan.id }}/edit">
  <label>Title
    <input name="title" required maxlength="200" value="{{ plan.title }}" />
  </label>
  <label>Project
    <input name="project" maxlength="200" value="{{ plan.project or "" }}" />
  </label>
  <label>Starts at
    <input type="datetime-local" name="start_at" required value="{{ start_value }}" />
  </label>
  <label>Ends at
    <input type="datetime-local" name="end_at" required value="{{ end_value }}" />
  </label>
  <label>CPU cores
    <input type="number" name="cpu_cores" min="1" value="{{ plan.cpu_cores if plan.cpu_cores is not none else "" }}" />
  </label>
  <label>Memory (GB)
    <input type="number" name="memory_gb" min="0" step="0.5" value="{{ plan.memory_gb if plan.memory_gb is not none else "" }}" />
  </label>
  <label>GPU count
    <input type="number" name="gpu_count" min="0" value="{{ plan.gpu_count if plan.gpu_count is not none else "" }}" />
  </label>
  <label>GPU IDs
    <input name="gpu_ids" value="{{ plan.gpu_ids|join(",") if plan.gpu_ids else "" }}" />
  </label>
  <label>Note
    <input name="note" maxlength="2000" value="{{ plan.note or "" }}" />
  </label>
  <button type="submit">Save changes</button>
  <a class="clear" href="/schedule">Back</a>
</form>
{% endblock %}
