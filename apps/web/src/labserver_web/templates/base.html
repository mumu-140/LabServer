<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}算力中枢 — LabServer{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css?v=9" />
    <script src="/static/vendor/htmx-2.0.4.min.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand-nav">
          <a class="brand" href="/">
            <span class="brand-mark" aria-hidden="true">L</span>
            <div class="brand-text-group">
              <span class="brand-name">算力中枢</span>
              <span class="brand-sub">LabServer</span>
            </div>
          </a>
          {% if viewer %}
          <nav class="main-nav">
            <a class="nav-link {% if active_tab == 'dashboard' %}active{% endif %}" href="/">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
              <span>总览</span>
              <span class="sr-only">Dashboard</span>
            </a>
            <a class="nav-link {% if active_tab == 'running' %}active{% endif %}" href="/running">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
              <span>实时</span>
              <span class="sr-only">Running</span>
            </a>
            <a class="nav-link {% if active_tab == 'schedule' %}active{% endif %}" href="/schedule">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              <span>排期</span>
              <span class="sr-only">Schedule</span>
            </a>
            {% if viewer.role.value == 'admin' %}
            <a class="nav-link {% if active_tab == 'users' %}active{% endif %}" href="/users">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
              <span>成员</span>
              <span class="sr-only">Users</span>
            </a>
            {% endif %}
          </nav>
          {% endif %}
        </div>
        <span class="header-spacer"></span>
        <div class="header-actions">
          {% if viewer %}
          <div class="user-nav">
            <span class="role-tag">
              {% if viewer.role.value == 'admin' %}管理员{% else %}研究员{% endif %}
              <span class="sr-only">{{ viewer.role.value }}</span>
            </span>
            <form action="/logout" method="post" class="logout-form">
              <button type="submit" class="logout-btn" title="安全登出">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 2px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                <span>退出</span>
                <span class="sr-only">Log out</span>
              </button>
            </form>
          </div>
          {% endif %}
        </div>
      </div>
    </header>

    <main class="page">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
