<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}LabServer{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css?v=5" />
    <script src="/static/vendor/htmx-2.0.4.min.js" defer></script>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('labserver-theme') || 'cyber';
          document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div class="cyber-ambient-glow" aria-hidden="true"></div>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand-nav">
          <a class="brand" href="/">
            <span class="brand-logo-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                <line x1="6" y1="6" x2="6.01" y2="6"></line>
                <line x1="6" y1="18" x2="6.01" y2="18"></line>
              </svg>
            </span>
            <span class="brand-name">LabServer</span>
            <span class="telemetry-tag">HUD</span>
          </a>
          {% if viewer %}
          <nav class="main-nav">
            <a class="nav-link {% if active_tab == 'dashboard' %}active{% endif %}" href="/">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
              Dashboard
            </a>
            <a class="nav-link {% if active_tab == 'running' %}active{% endif %}" href="/running">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
              Running
            </a>
            <a class="nav-link {% if active_tab == 'schedule' %}active{% endif %}" href="/schedule">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              Schedule
            </a>
            {% if viewer.role.value == 'admin' %}
            <a class="nav-link {% if active_tab == 'users' %}active{% endif %}" href="/users">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
              Users
            </a>
            {% endif %}
          </nav>
          {% endif %}
        </div>
        <div class="header-actions">
          <div class="theme-switcher" role="radiogroup" aria-label="Visual Theme">
            <button type="button" class="theme-btn" data-set-theme="cyber" title="Cyberpunk Cyan">
              <span class="theme-dot theme-dot-cyber"></span>
              <span class="theme-label">Cyber</span>
            </button>
            <button type="button" class="theme-btn" data-set-theme="matrix" title="Matrix Terminal">
              <span class="theme-dot theme-dot-matrix"></span>
              <span class="theme-label">Matrix</span>
            </button>
            <button type="button" class="theme-btn" data-set-theme="synthwave" title="Synthwave Neon">
              <span class="theme-dot theme-dot-synthwave"></span>
              <span class="theme-label">Synth</span>
            </button>
            <button type="button" class="theme-btn" data-set-theme="quantum" title="Quantum Stealth">
              <span class="theme-dot theme-dot-quantum"></span>
              <span class="theme-label">Stealth</span>
            </button>
          </div>
          {% if viewer %}
          <div class="user-nav">
            <span class="role-tag">{{ viewer.role.value }}</span>
            <form action="/logout" method="post" class="logout-form">
              <button type="submit" class="logout-btn">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 2px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Log out
              </button>
            </form>
          </div>
          {% endif %}
        </div>
      </div>
    </header>

    <main class="page">
      {% block content %}{% endblock %}
    </main>

    <script>
      (function() {
        function syncThemeUI(theme) {
          var btns = document.querySelectorAll('.theme-btn');
          btns.forEach(function(btn) {
            if (btn.getAttribute('data-set-theme') === theme) {
              btn.classList.add('active');
            } else {
              btn.classList.remove('active');
            }
          });
        }
        var cur = document.documentElement.getAttribute('data-theme') || 'cyber';
        syncThemeUI(cur);

        document.addEventListener('click', function(e) {
          var btn = e.target.closest('.theme-btn');
          if (!btn) return;
          var next = btn.getAttribute('data-set-theme');
          if (next) {
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('labserver-theme', next); } catch(err) {}
            syncThemeUI(next);
          }
        });
      })();
    </script>
  </body>
</html>
