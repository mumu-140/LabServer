{% extends "base.html" %}

{% block title %}Log in - LabServer{% endblock %}

{% block content %}
<section class="card" style="max-width: 400px; margin: 40px auto;">
  <h2>Log in to LabServer</h2>
  {% if error %}
  <div class="alert alert-error" role="alert" style="margin-bottom: 1rem; color: #b91c1c;">
    {{ error }}
  </div>
  {% endif %}
  <form method="post" action="/login" class="form">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus />
    </div>
    <div class="form-group" style="margin-top: 1rem;">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required />
    </div>
    <div class="form-actions" style="margin-top: 1.5rem;">
      <button type="submit" class="btn btn-primary">Log in</button>
    </div>
  </form>
</section>
{% endblock %}
