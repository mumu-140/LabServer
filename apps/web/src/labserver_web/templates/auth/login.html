{% extends "base.html" %}

{% block title %}登录系统 — 实验室算力中枢{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
  <section class="card auth-card">
    <div class="auth-header">
      <div class="brand-seal-icon auth-seal" aria-hidden="true">算</div>
      <div class="auth-terminal-tag">// 权限验证 · 实验室算力中枢</div>
      <h2>登录系统 · 算力中枢</h2>
      <p>授权科研人员登录，以开展节点遥测与多机算力排期</p>
    </div>

    {% if error %}
    <div class="alert alert-error" role="alert">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="form">
      <div class="form-group">
        <label for="username">登录用户名</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus placeholder="请输入您的用户名" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">登录密码</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" style="width: 100%;">
          <span>登 录 系 统</span>
          <span class="sr-only">Log in</span>
        </button>
      </div>
    </form>
  </section>
</div>
{% endblock %}
