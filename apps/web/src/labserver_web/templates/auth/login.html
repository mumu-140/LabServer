{% extends "base.html" %}

{% block title %}Log in - LabServer{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
  <section class="card auth-card">
    <div class="auth-header">
      <div class="brand-logo-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
          <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
          <line x1="6" y1="6" x2="6.01" y2="6"></line>
          <line x1="6" y1="18" x2="6.01" y2="18"></line>
        </svg>
      </div>
      <div class="auth-terminal-tag">// RESTRICTED ACCESS // LAB INFRASTRUCTURE</div>
      <h2>Log in to LabServer</h2>
      <p>Authorized compute coordination & telemetry console</p>
    </div>

    {% if error %}
    <div class="alert alert-error" role="alert">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus placeholder="Enter your username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Log in</button>
      </div>
    </form>
  </section>
</div>
{% endblock %}
