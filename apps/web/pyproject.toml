[project]
name = "labserver-web"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jinja2>=3.1,<3.2",
  "labserver-contracts",
  "pydantic==2.13.5",
  "python-multipart==0.0.22",
  "uvicorn==0.52.4",
]

[tool.uv.sources]
labserver-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labserver_web"]
